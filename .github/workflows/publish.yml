name: publish

# Publishes to npm when a release tag is pushed, or on manual dispatch.
#
# Why a workflow instead of a local `npm publish`:
# - the npm account's registry is pinned to a mirror locally, and mirrors reject
#   publishes, so the registry is named explicitly here;
# - provenance is generated by CI, which makes the published tarball traceable
#   back to this commit (npm shows the attestation on the package page).
#
# Requires an NPM_TOKEN repository secret: an npm automation token with publish
# rights for dsh-plugin-session-rename.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and validate without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The plugin has no dependencies; the tests use only node:test.
      - name: Run contract tests
        run: node --test

      - name: Verify the tarball contents
        run: npm pack --dry-run

      - name: Publish
        if: ${{ github.event_name == 'push' || inputs.dry-run == false }}
        run: npm publish --provenance --access public --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}