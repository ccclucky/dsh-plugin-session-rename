name: publish

# Publishes to npm when a release tag is pushed, or on manual dispatch.
#
# Why a workflow instead of a local `npm publish`:
# - the npm account's registry is pinned to a mirror locally, and mirrors reject
#   publishes, so the registry is named explicitly here;
# - provenance is generated by CI, which makes the published tarball traceable
#   back to this commit (npm shows the attestation on the package page).
#
# Requires an NPM_TOKEN repository secret. npm rejects a publish from a token
# that cannot satisfy the account's two-factor requirement, so the secret must
# be a **Granular Access Token with "Bypass 2FA" enabled** (Read and write,
# scoped to this package or to all packages). A classic token without bypass,
# or 2FA that is not enabled on the account, fails with a 403 on PUT.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and validate without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The plugin has no dependencies; the tests use only node:test.
      - name: Run contract tests
        run: node --test

      - name: Verify the tarball contents
        run: npm pack --dry-run

      # Fail in seconds with a readable cause instead of after a long upload:
      # npm answers a 4-minute retry loop with an opaque 403 when the token is
      # missing or cannot bypass the account's 2FA requirement.
      - name: Preflight the npm token
        if: ${{ github.event_name == 'push' || inputs.dry-run == false }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is empty. Add a Granular Access Token with Bypass 2FA enabled."
            exit 1
          fi
          whoami="$(npm whoami --registry https://registry.npmjs.org)" || {
            echo "::error::NPM_TOKEN is not accepted by registry.npmjs.org (401). Re-create the token."
            exit 1
          }
          echo "Token authenticates as: ${whoami}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: ${{ github.event_name == 'push' || inputs.dry-run == false }}
        run: npm publish --provenance --access public --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}